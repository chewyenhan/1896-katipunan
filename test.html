<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>1896: Revolution of Choice — 选择与革命</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/ui.css">
  <link rel="stylesheet" href="css/animation.css">
  <style>
    /* 测试页面样式 */
    #test-panel {
      position: fixed;
      top: 10px;
      right: 10px;
      background: rgba(44, 24, 16, 0.9);
      border: 2px solid #d4a574;
      border-radius: 8px;
      padding: 15px;
      z-index: 1000;
      max-width: 300px;
    }
    #test-panel h3 {
      color: #d4a574;
      margin-bottom: 10px;
    }
    #test-panel button {
      display: block;
      width: 100%;
      margin: 5px 0;
      padding: 8px;
      background: #5d4037;
      color: #f5f0e8;
      border: 1px solid #d4a574;
      border-radius: 4px;
      cursor: pointer;
    }
    #test-panel button:hover {
      background: #d4a574;
      color: #2c1810;
    }
    #test-result {
      margin-top: 10px;
      padding: 10px;
      background: rgba(0,0,0,0.3);
      border-radius: 4px;
      font-size: 12px;
      max-height: 150px;
      overflow-y: auto;
    }
    .test-ok { color: #4caf50; }
    .test-fail { color: #f44336; }
    .test-warn { color: #ff9800; }
  </style>
</head>
<body>
  <!-- 测试面板 -->
  <div id="test-panel">
    <h3>🧪 系统测试</h3>
    <button onclick="testTTS()">测试 TTS</button>
    <button onclick="testAudio()">测试音频</button>
    <button onclick="testImages()">测试图片</button>
    <button onclick="testJSON()">测试数据</button>
    <button onclick="testAll()">全量测试</button>
    <div id="test-result"></div>
  </div>

  <!-- 游戏容器 -->
  <div id="game-container">
    <!-- HUD -->
    <div id="hud">
      <div id="year-location">
        <span id="year-display">1892</span>
        <span id="location-display">马尼拉</span>
      </div>
      <div id="stats-bar">
        <span class="stat" title="希望"><i class="icon">❤</i><span id="hope-val">50</span></span>
        <span class="stat" title="恐惧"><i class="icon">🌙</i><span id="fear-val">30</span></span>
        <span class="stat" title="信任"><i class="icon">🤝</i><span id="trust-val">40</span></span>
        <span class="stat" title="支持度"><i class="icon">★</i><span id="support-val">50</span></span>
        <span class="stat" title="警戒"><i class="icon">⚠</i><span id="alert-val">20</span></span>
      </div>
    </div>

    <!-- Main Display -->
    <div id="main-display">
      <div id="background-layer">
        <img id="bg-image" src="" alt="">
      </div>
      <div id="character-layer"></div>
    </div>

    <!-- Dialogue Box -->
    <div id="dialogue-box">
      <div id="speaker-info">
        <img id="speaker-portrait" src="" alt="" style="display:none;">
        <span id="speaker-name"></span>
      </div>
      <div id="dialogue-text"></div>
      <div id="continue-hint">▼ 点击继续 / 按空格键</div>
    </div>

    <!-- Choices -->
    <div id="choices-container" class="hidden">
      <button class="choice-btn" data-index="0"></button>
      <button class="choice-btn" data-index="1"></button>
      <button class="choice-btn" data-index="2"></button>
    </div>

    <!-- Menu -->
    <div id="menu-overlay" class="overlay hidden">
      <div class="menu-content">
        <h2>菜单</h2>
        <button id="btn-continue">继续游戏</button>
        <button id="btn-save">保存进度</button>
        <button id="btn-load">读取进度</button>
        <button id="btn-settings">设置</button>
        <button id="btn-restart">重新开始</button>
      </div>
    </div>

    <!-- History Pause -->
    <div id="history-pause" class="overlay hidden">
      <div class="history-content">
        <h2>📜 历史档案</h2>
        <div id="history-experience"></div>
        <div id="history-facts"></div>
        <div id="history-exam-points"></div>
        <button id="continue-history">继续</button>
      </div>
    </div>
  </div>

  <!-- Audio Elements -->
  <audio id="bgm-audio" loop></audio>

  <script src="js/utils.js"></script>
  <script src="js/state.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/tts.js"></script>
  <script src="js/dialogue.js"></script>
  <script src="js/choice.js"></script>
  <script src="js/sceneManager.js"></script>
  <script src="js/save.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/game.js"></script>
  <script src="data/story.json"></script>
  <script src="js/scoring.js"></script>

  <script>
    // 测试函数
    function log(msg, type='info') {
      const el = document.getElementById('test-result');
      const cls = type === 'ok' ? 'test-ok' : type === 'fail' ? 'test-fail' : 'test-warn';
      el.innerHTML += `<div class="${cls}">[${new Date().toLocaleTimeString()}] ${msg}</div>`;
      el.scrollTop = el.scrollHeight;
    }

    async function testTTS() {
      log('测试 TTS...');
      try {
        if (!window.speechSynthesis) {
          log('❌ SpeechSynthesis API 不可用', 'fail');
          return;
        }
        const voices = window.speechSynthesis.getVoices();
        log(`✓ 语音库加载完成，共 ${voices.length} 个语音`, 'ok');

        const zhVoice = voices.find(v => v.lang.includes('zh'));
        if (zhVoice) {
          log(`✓ 中文语音: ${zhVoice.name}`, 'ok');
        } else {
          log('⚠ 未找到中文语音，使用默认语音', 'warn');
        }

        // 测试朗读
        const testText = '你好，这是 1896 年菲律宾革命游戏的测试语音。';
        tts.setLanguage('zh');
        await tts.speak(testText);
        log('✓ TTS 朗读测试完成', 'ok');
      } catch(e) {
        log(`❌ TTS 测试失败: ${e.message}`, 'fail');
      }
    }

    function testAudio() {
      log('测试音频系统...');
      try {
        log(`✓ Audio 对象已创建`, 'ok');
        log(`✓ BGM 元素: ${document.getElementById('bgm-audio') ? '存在' : '缺失'}`, audio.bgm ? 'ok' : 'fail');
        log(`✓ 音乐开关: ${audio.musicEnabled ? '开启' : '关闭'}`, 'info');
        log(`✓ 当前音量: ${Math.round(audio.volume * 100)}%`, 'info');
      } catch(e) {
        log(`❌ 音频测试失败: ${e.message}`, 'fail');
      }
    }

    async function testImages() {
      log('测试图片加载...');
      try {
        const bgPaths = [
          'assets/backgrounds/01_prologue_manila.jpg',
          'assets/backgrounds/02_bonifacio_katipunan.jpg',
          'assets/backgrounds/03_rizal_arrest.jpg',
          'assets/backgrounds/04_cry_pugad_lawin.jpg',
          'assets/backgrounds/05_battle_jungle.jpg'
        ];

        let loaded = 0;
        let failed = 0;

        for (const path of bgPaths) {
          try {
            const img = new Image();
            img.src = path;
            await new Promise((resolve, reject) => {
              img.onload = resolve;
              img.onerror = reject;
              setTimeout(reject, 5000);
            });
            loaded++;
            log(`✓ ${path.split('/').pop()}`, 'ok');
          } catch(e) {
            failed++;
            log(`✗ ${path.split('/').pop()}`, 'fail');
          }
        }

        log(`图片加载完成: ${loaded} 成功, ${failed} 失败`, failed === 0 ? 'ok' : 'warn');
      } catch(e) {
        log(`❌ 图片测试失败: ${e.message}`, 'fail');
      }
    }

    function testJSON() {
      log('测试数据文件...');
      try {
        if (typeof storyData === 'undefined') {
          log('❌ storyData 未定义', 'fail');
          return;
        }

        const scenes = storyData.scenes || [];
        log(`✓ 剧情数据: ${scenes.length} 个场景`, 'ok');

        // 检查必填字段
        const requiredFields = ['id', 'chapter', 'title', 'year', 'location', 'background', 'dialogues'];
        scenes.forEach((scene, i) => {
          const missing = requiredFields.filter(f => !scene[f]);
          if (missing.length > 0) {
            log(`⚠ 场景 ${scene.id}: 缺少 ${missing.join(', ')}`, 'warn');
          }
        });

        log(`✓ 所有场景字段检查完成`, 'ok');
      } catch(e) {
        log(`❌ 数据测试失败: ${e.message}`, 'fail');
      }
    }

    async function testAll() {
      log('=== 开始全量测试 ===', 'info');
      await testJSON();
      await testImages();
      await testAudio();
      await testTTS();
      log('=== 测试完成 ===', 'info');
    }

    // 页面加载完成后自动测试
    window.addEventListener('DOMContentLoaded', async () => {
      log('游戏初始化...', 'info');

      // 等待 1 秒后自动测试
      setTimeout(async () => {
        await testAll();
      }, 1000);
    });
  </script>
</body>
</html>
